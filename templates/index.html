<!DOCTYPE html>
<html>
<head>
    <title>Hospital Monitoring Dashboard</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>Hospital Monitoring Dashboard</h1>

    <div class="button-bar">

        <button onclick="loadData('/users')">
            Logged-In Users
        </button>

        <button onclick="loadData('/ssh')">
            SSH Activity
        </button>

        <button onclick="loadData('/failed')">
            Failed Logins
        </button>

        <button onclick="loadData('/network')">
            Network Status
        </button>

        <button onclick="loadData('/patients')">
            Patient Data
        </button>

    </div>

    <pre id="terminal">
Hospital Monitoring Dashboard Ready...
Select a monitoring option above.
    </pre>

<script>
function loadData(route)
{
    fetch(route)
        .then(response => response.text())
        .then(data =>
        {
            document.getElementById("terminal").textContent = data;
        })
        .catch(error =>
        {
            document.getElementById("terminal").textContent =
                "Error: " + error;
        });
}
</script>

</body>
</html>
