<!DOCTYPE html>
<html>
<head>
    <title>Hospital Monitoring Dashboard</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>Hospital Monitoring Dashboard</h1>

    <div class="button-bar">

        <button onclick="loadData('/users')">
            Logged-In Users
        </button>

        <button onclick="loadData('/ssh')">
            SSH Activity
        </button>

        <button onclick="loadData('/failed')">
            Failed Logins
        </button>

        <button onclick="loadData('/network')">
            Network Status
        </button>

        <button onclick="loadData('/patients')">
            Patient Data
        </button>

    </div>

    <pre id="terminal">
Hospital Monitoring Dashboard Ready...
Select a monitoring option above.
    </pre>

    <div id="network-result" style="display:none;"></div>

<script>
function loadData(route)
{
    const terminal = document.getElementById("terminal");
    const networkResult = document.getElementById("network-result");

    fetch(route)
        .then(response => response.text())
        .then(data =>
        {
            if (route === "/network")
            {
                terminal.style.display = "none";
                networkResult.style.display = "block";
                networkResult.innerHTML = data;
            }
            else
            {
                networkResult.style.display = "none";
                terminal.style.display = "block";
                terminal.textContent = data;
            }
        })
        .catch(error =>
        {
            networkResult.style.display = "none";
            terminal.style.display = "block";
            terminal.textContent = "Error: " + error;
        });
}
</script>

</body>
</html>
